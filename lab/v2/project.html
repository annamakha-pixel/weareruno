<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RUNO</title>
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2.css">
</head>
<body>
<div class="proj">
  <nav class="navcol">
    <a id="prev" href="#" aria-label="Previous project">↑</a>
    <a href="./" aria-label="Close">×</a>
    <a id="next" href="#" aria-label="Next project">↓</a>
  </nav>
  <div class="vr"></div>
  <div class="band"><div class="vmarq"><span id="vm"></span></div></div>
  <div class="vr"></div>
  <main class="content">
    <header class="top">
      <a href="./" class="logo"><img src="../../logo.svg" alt="RUNO"></a>
      <nav class="info"><a href="./">Work</a><a href="mailto:hello@weareruno.com">Email</a><a href="https://instagram.com/weareruno" target="_blank" rel="noopener">Instagram</a></nav>
      <a class="cta" href="/offsite">Corporate offsite →</a>
    </header>
    <h1 class="p-title" id="t"></h1>
    <div class="p-meta mono" id="m"></div>
    <p class="p-desc" id="d"></p>
    <div class="p-rule"></div>
    <section class="gallery" id="g"></section>
    <a class="p-next" id="nx" href="#"></a>
  </main>
</div>
<script src="data.js"></script>
<script>
(function(){
  const P = window.RUNO_PROJECTS;
  const id = new URLSearchParams(location.search).get('p') || P[0].id;
  let i = Math.max(0, P.findIndex(p => p.id === id));
  const p = P[i], prev = P[(i - 1 + P.length) % P.length], next = P[(i + 1) % P.length];
  document.title = p.title + ' - RUNO';
  document.getElementById('t').textContent = p.title;
  document.getElementById('m').innerHTML = [p.type].concat(p.meta).map(x => '<span>' + x + '</span>').join('');
  document.getElementById('d').textContent = p.desc;
  document.getElementById('vm').textContent = (p.row[0] + ' ' + p.glyph + ' ').repeat(14);
  document.getElementById('prev').href = 'project.html?p=' + prev.id;
  document.getElementById('next').href = 'project.html?p=' + next.id;
  const nx = document.getElementById('nx');
  nx.href = 'project.html?p=' + next.id;
  nx.textContent = 'Next ' + next.glyph + ' ' + next.row[0];
  // asymmetric placement: small and medium images, lots of air
  const slots = [
    'grid-column: 7 / 13;',
    'grid-column: 2 / 6; margin-top: 18vw;',
    'grid-column: 8 / 11;',
    'grid-column: 1 / 5;',
    'grid-column: 6 / 12; margin-top: 8vw;',
    'grid-column: 3 / 7;',
    'grid-column: 9 / 13; margin-top: 12vw;',
    'grid-column: 1 / 4; margin-top: 4vw;',
    'grid-column: 5 / 10;'
  ];
  const g = document.getElementById('g');
  p.imgs.forEach((src, k) => {
    const f = document.createElement('figure');
    f.style.cssText = slots[k % slots.length];
    f.innerHTML = '<img src="../../projects/' + src + '" alt="' + p.title + '" loading="lazy"><figcaption class="mono">' + String(k + 1).padStart(2, '0') + ' / ' + String(p.imgs.length).padStart(2, '0') + '</figcaption>';
    g.appendChild(f);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') location.href = './';
    if (e.key === 'ArrowLeft') location.href = 'project.html?p=' + prev.id;
    if (e.key === 'ArrowRight') location.href = 'project.html?p=' + next.id;
  });
})();
</script>
</body>
</html>
